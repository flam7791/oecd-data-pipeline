[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oecd-data-pipeline"
version = "0.2.0"
description = "Fetch and clean OECD Data Explorer indicators with Python, add plain-English notes with Microsoft 365 Copilot, and check every note before accepting it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "flam7791" }]
dependencies = ["pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
